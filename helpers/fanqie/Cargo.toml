[package]
name = "fanqie-helper"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-only"

[workspace]

[dependencies]
mlua = { version = "=0.12.2", features = ["luajit", "vendored", "serde"] }
serde_json = "=1.0.154"
md-5 = "=0.10.6"
flate2 = "=1.1.11"
ureq = { version = "=3.5.1", default-features = false, features = ["native-tls", "win-system-proxy"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Credentials", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
