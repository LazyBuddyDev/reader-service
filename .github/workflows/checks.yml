name: Reader checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Parser, library and persistence tests
        run: cargo test --locked
      - name: Native chapter helper checks
        working-directory: helpers/fanqie
        run: |
          cargo fmt -- --check
          cargo test --locked
      - name: Complete module package
        shell: pwsh
        run: ./scripts/package.ps1 -Destination "${{ github.workspace }}/target/packages/development"
      - uses: actions/upload-artifact@v4
        with:
          name: reader-windows-x86_64
          path: target/packages/reader-*.zip
