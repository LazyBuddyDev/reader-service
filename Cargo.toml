[package]
name = "reader-service"
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
roxmltree = "=0.20.0"
encoding_rs = "=0.8.35"
imagesize = "=0.13.0"
base64 = "=0.22.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
